# better-auth 1.6.12 carga @better-auth/kysely-adapter, que importa
# DEFAULT_MIGRATION_LOCK_TABLE / DEFAULT_MIGRATION_TABLE — exports que kysely@0.29.x
# eliminó. Usamos Drizzle (no kysely), pero better-auth lo carga en context/init,
# así que fijamos kysely a 0.28.x para que el build compile.
overrides:
  kysely: 0.28.17

onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
