# Despliegue a producción en Vercel (https://ayuda.sinai.net.co).
#
# La app vive en `web/` y el proyecto de Vercel tiene "Root Directory = web",
# por eso los comandos de la CLI se ejecutan desde la raíz del repositorio:
# la CLI aplica el Root Directory por su cuenta.
#
# Secrets requeridos (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

name: Deploy a Vercel (producción)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Un solo despliegue de producción a la vez; si llegan varios pushes seguidos,
# se conserva el más reciente en cola sin cancelar el que está en curso.
concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  # La CLI de Vercel lee estas variables directamente; así el token nunca
  # aparece en la línea de comandos y GitHub enmascara los valores en los logs.
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    name: Build y deploy
    # Evita desplegar a producción otra rama si se lanza manualmente.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verificar secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secret $name en GitHub (Settings > Secrets and variables > Actions)."
              missing=1
            fi
          done
          exit $missing

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          # Usa la versión fijada en "packageManager" de web/package.json.
          package_json_file: web/package.json

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          # Debe coincidir con "Node.js Version" del proyecto en Vercel (24.x).
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Instalar Vercel CLI
        run: npm install --global vercel@62

      - name: Descargar configuración y variables de producción
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod

      - name: Deploy
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Desplegado en: $url" >> "$GITHUB_STEP_SUMMARY"
